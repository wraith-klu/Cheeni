<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" style="background:#090d16; border-radius: 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>
    <linearGradient id="orbGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <radialGradient id="orbCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#67e8f9" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseRing {
      0% { r: 76px; opacity: 0.7; stroke-width: 2px; }
      50% { r: 96px; opacity: 0.25; stroke-width: 4px; }
      100% { r: 76px; opacity: 0.7; stroke-width: 2px; }
    }
    @keyframes corePulse {
      0% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(56,189,248,0.8)); }
      50% { transform: scale(1.06); filter: drop-shadow(0 0 30px rgba(192,132,252,0.9)); }
      100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(56,189,248,0.8)); }
    }
    @keyframes waveBar {
      0%, 100% { height: 10px; y: 405px; }
      50% { height: 32px; y: 394px; }
    }
    @keyframes badgeGlow {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }
    .pulsing-ring { animation: pulseRing 3.5s ease-in-out infinite; transform-origin: 450px 215px; }
    .core-orb { animation: corePulse 3s ease-in-out infinite; transform-origin: 450px 215px; }
    .w-1 { animation: waveBar 1.1s ease-in-out infinite 0.1s; }
    .w-2 { animation: waveBar 0.9s ease-in-out infinite 0.3s; }
    .w-3 { animation: waveBar 1.3s ease-in-out infinite 0.2s; }
    .w-4 { animation: waveBar 0.8s ease-in-out infinite 0.4s; }
    .w-5 { animation: waveBar 1.2s ease-in-out infinite 0.15s; }
    .badge { animation: badgeGlow 2s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="900" height="480" rx="16" fill="url(#bgGlow)" />

  <!-- Top Glass Header Bar -->
  <rect x="25" y="20" width="850" height="54" rx="12" fill="#131c2e" fill-opacity="0.8" stroke="#1e293b" stroke-width="1" />
  
  <!-- Logo & Title -->
  <circle cx="52" cy="47" r="14" fill="url(#orbGradient)" />
  <text x="76" y="52" fill="#f8fafc" font-size="17" font-weight="700" letter-spacing="0.5">Cheeni AI Assistant</text>
  <rect x="245" y="38" width="90" height="20" rx="10" fill="#064e3b" stroke="#059669" stroke-width="1" class="badge" />
  <circle cx="257" cy="48" r="4" fill="#10b981" />
  <text x="267" y="52" fill="#34d399" font-size="11" font-weight="600">Online 2026</text>

  <!-- Status badges on top right -->
  <rect x="635" y="36" width="105" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="650" y="52" fill="#94a3b8" font-size="12">🎙️ Voice Active</text>
  <rect x="750" y="36" width="105" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="764" y="52" fill="#94a3b8" font-size="12">⚡ Laptop Mode</text>

  <!-- Ambient Orb Glow Circles -->
  <circle cx="450" cy="215" r="140" fill="url(#orbCenterGlow)" />
  <circle cx="450" cy="215" r="95" fill="none" stroke="#38bdf8" stroke-opacity="0.4" class="pulsing-ring" />
  <circle cx="450" cy="215" r="115" fill="none" stroke="#a855f7" stroke-opacity="0.25" class="pulsing-ring" style="animation-delay: -1.7s;" />

  <!-- Core Glowing Cheeni Orb -->
  <circle class="core-orb" cx="450" cy="215" r="62" fill="url(#orbGradient)" filter="url(#glowFilter)" />
  <circle cx="450" cy="215" r="54" fill="url(#orbCenterGlow)" />

  <!-- Voice Response Prompt Capsule -->
  <rect x="180" y="318" width="540" height="42" rx="21" fill="#131d31" fill-opacity="0.9" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5" />
  <text x="450" y="344" fill="#e2e8f0" font-size="14.5" font-weight="500" text-anchor="middle">
    "Hello! I am Cheeni. Ready for mock interviews, coding, and OS actions."
  </text>

  <!-- Animated Sound Equalizer Waveform -->
  <g fill="#38bdf8">
    <rect class="w-1" x="400" width="5" rx="2.5" />
    <rect class="w-2" x="412" width="5" rx="2.5" />
    <rect class="w-3" x="424" width="5" rx="2.5" />
    <rect class="w-4" x="436" width="5" rx="2.5" />
    <rect class="w-5" x="448" width="5" rx="2.5" />
    <rect class="w-2" x="460" width="5" rx="2.5" />
    <rect class="w-3" x="472" width="5" rx="2.5" />
    <rect class="w-1" x="484" width="5" rx="2.5" />
    <rect class="w-4" x="496" width="5" rx="2.5" />
  </g>

  <!-- Interactive Controls Bar Bottom -->
  <rect x="250" y="438" width="400" height="30" rx="15" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
  <text x="450" y="457" fill="#94a3b8" font-size="12" text-anchor="middle">
    Press Space or Alt+M to talk • Escape to stop • Ctrl+K to search
  </text>
</svg>
