services:
  # ── Agent: Python FastAPI (Handles ALL AI, Routes, and ML Fallbacks) ────────
  - type: web
    name: cheeni-agent
    runtime: python
    plan: free
    rootDir: agent
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 2026
    envVars:
      - key: PORT
        value: 2026
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: ENVIRONMENT
        value: production
